name: albayan
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  intl: ^0.20.0
  flutter_svg: ^2.2.3
  hugeicons: ^1.1.4
  image_picker: ^1.2.1
  permission_handler: ^11.0.1
  easy_localization: ^3.0.8
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5

  # Networking
  dio: ^5.3.3

  # Local Storage
  shared_preferences: ^2.3.2

  pinput: ^5.0.0
  qr_flutter: ^4.1.0
  firebase_core: ^4.15.0
  syncfusion_flutter_pdfviewer: ^31.2.2
  path_provider: ^2.1.5
  url_launcher: ^6.3.2
  pdfx: ^2.11.0
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  syncfusion_flutter_pdf: ^31.2.2
  flutter_widget_from_html_core: ^0.17.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/translations/
    - assets/images/
    - assets/icons/

  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf